
<!DOCTYPE html>
<!-- Indica al navegador que este documento utiliza HTML5 -->

<html lang="es">
<!-- Inicio del documento HTML -->

<head>
<!-- Sección de configuración de la página -->

<meta charset="UTF-8">
<!-- Permite mostrar correctamente tildes y caracteres especiales -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Adapta la página a celulares y computadores -->

<title>Bitácora Multimedial</title>
<!-- Nombre que aparece en la pestaña del navegador -->

<style>

/* Configuración general */

* {
    box-sizing: border-box;
}

/* Estilo del fondo de la página */

body {
    margin: 0;
    min-height: 100vh;
    background-color: #430B16;
    color: white;
    font-family: Georgia, serif;
}

/* Portada principal */

.portada {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    text-align: center;
}

/* Título principal */

h1 {
    font-size: 85px;
    letter-spacing: 8px;
    color: #F8F0E8;
    text-shadow: 4px 5px 8px rgba(0,0,0,0.6);
    margin: 0;
}

/* Línea decorativa */

.linea {
    width: 250px;
    height: 2px;
    background-color: #D6B9A0;
    margin-top: 20px;
}

/* Datos personales */

.datos {
    position: absolute;
    bottom: 35px;
    right: 45px;
    text-align: right;
    line-height: 1.8;
}

/* Texto de los datos */

.datos p {
    margin: 3px;
    font-size: 17px;
}

/* Adaptación para celulares */

@media (max-width: 600px) {

    h1 {
        font-size: 43px;
        letter-spacing: 4px;
    }

    .datos {
        right: 20px;
        bottom: 25px;
    }

}

</style>
<!-- Fin de los estilos CSS -->

</head>

<body>
<!-- Inicio del contenido visible -->

<div class="portada">

    <h1>BITÁCORA</h1>
    <!-- Título central -->

    <div class="linea"></div>
    <!-- Línea decorativa -->

    <div class="datos">

        <p><strong>Amzy Hormazabal</strong></p>

        <p>Profesor: Mauricio Roman</p>

        <p>Asignatura: Multimedial de Grado</p>

    </div>

</div>

</body>

</html>
<!-- Fin del documento HTML -->
